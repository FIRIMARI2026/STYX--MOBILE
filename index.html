<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYX MOBILE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .menu-container {
            text-align: center;
            border: 2px solid rgba(0, 255, 204, 0.4);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(10px);
            width: 320px;
        }
        h1 {
            font-size: 32px;
            color: #00ffcc;
            margin-bottom: 5px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .subtitle {
            color: #9ca3af;
            font-size: 12px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: linear-gradient(135deg, #00ffcc 0%, #00b386 100%);
            color: #030712;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.5);
            background: linear-gradient(135deg, #1affd1 0%, #00cc99 100%);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid #374151;
            color: #d1d5db;
            box-shadow: none;
        }
        .btn-secondary:hover {
            border-color: #00ffcc;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
        }
        .footer-info {
            margin-top: 25px;
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>STYX MOBILE</h1>
        <div class="subtitle">Alpha v0.1</div>
        
        <button class="btn" onclick="startGame()">O'YINNI BOSHLASH</button>
        <button class="btn btn-secondary" onclick="openSettings()">SOZLAMALAR</button>
        <button class="btn btn-secondary" onclick="openAbout()">LOYIHA HAQIDA</button>

        <div class="footer-info">Birgalikda qurilmoqda &bull; 2026</div>
    </div>

    <script>
        function startGame() {
            alert("O'yin muhiti yuklanmoqda... Keyingi bosqichga o'tamiz, do'stim!");
        }

        function openSettings() {
            alert("Sozlamalar bo'limi tez orada qo'shiladi.");
        }

        function openAbout() {
            alert("STYX MOBILE — yuqori sifatli mobil loyiha.");
        }
    </script>

</body>
</html>
