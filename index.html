<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STYX MOBILE - Season 1: Tactical Strike</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030712;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* BOSH MENYU */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .menu-box {
            text-align: center;
            border: 2px solid rgba(0, 255, 204, 0.4);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.25);
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            width: 320px;
        }
        h1 {
            font-size: 30px;
            color: #00ffcc;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }
        .subtitle {
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: linear-gradient(135deg, #00ffcc 0%, #00b386 100%);
            color: #030712;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid #374151;
            color: #d1d5db;
            box-shadow: none;
        }
        .hidden {
            display: none !important;
        }
        /* O'YIN INTERFEYSI (HUD) */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }
        /* OTISH TUGMASI */
        #fire-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 50, 50, 0.7);
            border: 3px solid #ff3333;
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.5);
            cursor: pointer;
        }
        #fire-btn:active {
            transform: scale(0.9);
        }
        /* JOYSTICK */
        .joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-thumb {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 46px;
            height: 46px;
            background: rgba(0, 255, 204, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>
    <!-- Three.js Kutubxonasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- BOSH MENYU -->
    <div id="main-menu">
        <div class="menu-box">
            <h1>STYX MOBILE</h1>
            <div class="subtitle">Season 1: Tactical Strike</div>
            <button class="btn" onclick="launchGame()">1-MAVSUSHNI BOSHLASH</button>
            <button class="btn btn-secondary" onclick="alert('1-Mavsum: Dushmanlarni yo‘q qiling va 10 ball yig‘ing!')">MAVSUM HAQIDA</button>
        </div>
    </div>

    <!-- 3D KANVAS -->
    <div id="canvas-container"></div>

    <!-- O'YIN HUD VA BOSHQARUV -->
    <div id="game-ui" class="hidden">
        <div class="hud-top">
            <div id="score-text">BALL: 0 / 10</div>
            <div id="status-text">1-MAVSUM</div>
        </div>
        <div class="joystick-zone" id="joystick">
            <div class="joystick-thumb" id="thumb"></div>
        </div>
        <div id="fire-btn" onclick="shootBullet()">OTISH</div>
    </div>

    <script>
        let scene, camera, renderer, player;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isGameStarted = false;
        let targets = [];
        let bullets = [];
        let score = 0;
        const targetGoal = 10;

        function launchGame() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            isGameStarted = true;
            init3D();
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            // Sahina
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050b14);
            scene.fog = new THREE.FogExp2(0x050b14, 0.025);

            // Kamera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);

            // Render
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Yorug'lik
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.2);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Yer (Arena)
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.7 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(120, 60, 0x00ffcc, 0x1e293b);
            grid.position.y = 0.01;
            scene.add(grid);

            // O'yinchi (Personaj)
            const playerGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.2, metalness: 0.9 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.y = 0.9;
            scene.add(player);

            // Muhit to'siqlari va Dushmanlar (Targets)
            spawnTargets();

            // Hodisalar
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'w') moveForward = true;
                if (e.key === 's') moveBackward = true;
                if (e.key === 'a') moveLeft = true;
                if (e.key === 'd') moveRight = true;
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === 'w') moveForward = false;
                if (e.key === 's') moveBackward = false;
                if (e.key === 'a') moveLeft = false;
                if (e.key === 'd') moveRight = false;
            });

            animate();
        }

        function spawnTargets() {
            // Dushman nishonlarni yaratish
            for (let i = 0; i < targetGoal; i++) {
                const targetGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                const targetMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3, metalness: 0.8 });
                const target = new THREE.Mesh(targetGeo, targetMat);
                
                target.position.set(
                    (Math.random() - 0.5) * 35,
                    0.6,
                    -10 - Math.random() * 30
                );
                scene.add(target);
                targets.push(target);
            }
        }

        function shootBullet() {
            if (!isGameStarted) return;
            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(player.position);
            bullet.position.y += 0.3;
            
            // O'qning harakat yo'nalishi (oldinga)
            bullet.velocity = new THREE.Vector3(0, 0, -0.8);
            scene.add(bullet);
            bullets.push(bullet);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGameStarted) {
                // O'yinchini harakatlantirish
                if (moveForward) player.position.z -= 0.12;
                if (moveBackward) player.position.z += 0.12;
                if (moveLeft) player.position.x -= 0.12;
                if (moveRight) player.position.x += 0.12;

                // Kamerani ergashuvi
                camera.position.x = player.position.x;
                camera.position.z = player.position.z + 7;
                camera.lookAt(player.position.x, player.position.y, player.position.z);

                // O'qlarni harakati va nishonga tegishini tekshirish
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.position.add(b.velocity);

                    // Dushmanlar bilan to'qnashuvni tekshirish
                    for (let j = targets.length - 1; j >= 0; j--) {
                        let t = targets[j];
                        if (b.position.distanceTo(t.position) < 1.2) {
                            scene.remove(t);
                            targets.splice(j, 1);
                            scene.remove(b);
                            bullets.splice(i, 1);
                            
                            score++;
                            document.getElementById('score-text').innerText = `BALL: ${score} / ${targetGoal}`;

                            if (score >= targetGoal) {
                                alert("TABRIKLAYMAN, DO'STIM! 1-MAVSUM MUVAFFAQIYATLI YAKUNLANDI!");
                                location.reload();
                            }
                            break;
                        }
                    }

                    // Uzoqqa ketgan o'qlarni o'chirish
                    if (b && b.position.z < -60) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Mobil Joystick
        const joystick = document.getElementById('joystick');
        const thumb = document.getElementById('thumb');
        let joystickPressed = false;

        joystick.addEventListener('pointerdown', () => { joystickPressed = true; });
        window.addEventListener('pointerup', () => { 
            joystickPressed = false; 
            thumb.style.transform = `translate(0px, 0px)`;
            moveForward = moveBackward = moveLeft = moveRight = false;
        });

        joystick.addEventListener('pointermove', (e) => {
            if (!joystickPressed) return;
            const rect = joystick.getBoundingClientRect();
            const x = e.clientX - (rect.left + rect.width / 2);
            const y = e.clientY - (rect.top + rect.height / 2);
            const distance = Math.min(30, Math.hypot(x, y));
            const angle = Math.atan2(y, x);
            
            thumb.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;

            moveForward = y < -10;
            moveBackward = y > 10;
            moveLeft = x < -10;
            moveRight = x > 10;
        });
    </script>
</body>
</html>
