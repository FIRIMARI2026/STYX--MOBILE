<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STYX MOBILE - Battle Royale Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* LOBBY */
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.98) 100%);
            display: flex; flex-direction: column; justify-content: space-between; padding: 40px; z-index: 30;
        }
        .lobby-header { display: flex; justify-content: space-between; align-items: center; }
        .game-logo { font-size: 46px; font-weight: 900; color: #fff; letter-spacing: 4px; text-shadow: 0 0 25px rgba(245, 158, 11, 0.7); }
        .game-logo span { color: #f59e0b; }
        .badge { background: linear-gradient(90deg, #f59e0b, #ea580c); color: #000; padding: 6px 16px; border-radius: 4px; font-weight: 900; font-size: 13px; }
        .btn-start {
            background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
            color: #000; font-size: 24px; font-weight: 900; padding: 20px 60px;
            border: none; border-radius: 8px; cursor: pointer; letter-spacing: 2px;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.7); text-transform: uppercase;
        }
        .btn-start:active { transform: scale(0.95); }
        .hidden { display: none !important; }

        /* HUD & RADAR */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .hud-top { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
        .stats-group { display: flex; gap: 10px; }
        .stat-card { background: rgba(0, 0, 0, 0.7); border-left: 4px solid #f59e0b; padding: 8px 14px; color: #fff; font-weight: bold; font-size: 14px; backdrop-filter: blur(6px); border-radius: 0 6px 6px 0; }
        .stat-card span { color: #f59e0b; font-size: 18px; margin-left: 5px; }

        #minimap {
            width: 120px; height: 120px; border-radius: 50%;
            border: 3px solid rgba(245, 158, 11, 0.8); background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        /* ZONE WARNING */
        #zone-warning {
            position: absolute; top: 65px; left: 20px; background: rgba(37, 99, 235, 0.85);
            color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: bold;
            border-left: 4px solid #60a5fa; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* CROSSHAIR & SCOPE */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px; pointer-events: none; transition: all 0.1s;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #22c55e; box-shadow: 0 0 6px rgba(0,255,0,0.8); }
        #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }
        #crosshair.hit::before, #crosshair.hit::after { background: #ef4444; transform: scale(1.4); }
